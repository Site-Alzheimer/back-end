# Site público em https://neuroia.ifce.edu.br (/etc/nginx/sites-available/neuroia-https),
# ligado pelo publicar.sh depois do teste local. Certificado do Let's Encrypt, renovado pelo certbot.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name neuroia.ifce.edu.br;
    server_tokens off;  # não mostra a versão do nginx

    ssl_certificate     /etc/letsencrypt/live/neuroia.ifce.edu.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neuroia.ifce.edu.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:neuroia_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Exame enviado: o front comprime o .nii antes; 100 MB cobre até um .nii sem compressão
    client_max_body_size 100m;

    include /etc/nginx/snippets/neuroia-rotas.conf;
}
