# nginx da VM (/etc/nginx/sites-available/neuroia), instalado pelo base.sh.
# A API (127.0.0.1:8000) e o front (127.0.0.1:8080) rodam em containers e só escutam localmente.
# O HTTPS público (porta 443) fica em neuroia-https.conf, ligado pelo publicar.sh.

# Cada análise ocupa a CPU por ~40 s: no máximo 6 por minuto por IP (com folga de 5)
limit_req_zone $binary_remote_addr zone=neuroia_analise:10m rate=6r/m;

upstream neuroia_api { server 127.0.0.1:8000; }
upstream neuroia_web { server 127.0.0.1:8080; }

# Porta 80: só o desafio do Let's Encrypt e o redirecionamento para HTTPS (regra da CTI)
server {
    listen 80;
    listen [::]:80;
    server_name neuroia.ifce.edu.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Teste local: o site completo só dentro da VM, sem HTTPS. Acesso pelo túnel SSH
# (ssh -L 8088:127.0.0.1:8088 ...), para testar antes de expor, como pede a CTI.
server {
    listen 127.0.0.1:8088;
    server_name _;

    client_max_body_size 100m;
    include /etc/nginx/snippets/neuroia-rotas.conf;
}
