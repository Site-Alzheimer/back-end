# Cabeçalhos repassados aos containers (/etc/nginx/snippets/neuroia-proxy.conf).
# Fica num arquivo à parte porque o nginx não herda proxy_set_header num location que define os seus.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
