# Rotas do site (/etc/nginx/snippets/neuroia-rotas.conf), usadas pela porta 443 e pelo teste local.
# O que é da API vai para o container da API; todo o resto é o site (Angular).

# Análise (envio próprio ou amostra): limite por IP e espera longa (cada exame leva ~40 s na VM)
location /v1/predict/ {
    limit_req zone=neuroia_analise burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/neuroia-proxy.conf;
    proxy_pass http://neuroia_api;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Envio para a fila de análises (próprio ou amostra), com o mesmo limite por IP. A resposta é
# imediata (202); a consulta do resultado (GET /v1/analises/{job_id}) cai na location /v1/, sem limite
location ~ ^/v1/analises(/amostra/[^/]+)?$ {
    limit_req zone=neuroia_analise burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/neuroia-proxy.conf;
    proxy_pass http://neuroia_api;
}

location /v1/ {
    include /etc/nginx/snippets/neuroia-proxy.conf;
    proxy_pass http://neuroia_api;
}

location = /healthz {
    include /etc/nginx/snippets/neuroia-proxy.conf;
    proxy_pass http://neuroia_api;
}

# Progresso ao vivo pelo WebSocket, das versões antigas do front. O atual usa SSE em
# /v1/progress/, que passa pela location /v1/ (a API manda X-Accel-Buffering: no e um ping a cada 15 s)
location /ws/ {
    include /etc/nginx/snippets/neuroia-proxy.conf;
    proxy_pass http://neuroia_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
}

# Documentação da API (Swagger), para quem quiser usar a API direto
location ~ ^/(docs|redoc|openapi\.json)$ {
    include /etc/nginx/snippets/neuroia-proxy.conf;
    proxy_pass http://neuroia_api;
}

location / {
    include /etc/nginx/snippets/neuroia-proxy.conf;
    proxy_pass http://neuroia_web;
}
