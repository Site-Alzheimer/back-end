# CI da API: monta a imagem (TensorFlow do conda-forge, roda em CPU sem AVX) e confere que a
# API importa sem erro; na main, publica no GHCR (ghcr.io/site-alzheimer/back-end), que a VM baixa.
# O paridade.py não roda aqui: precisa dos modelos e dos exames, que não ficam no GitHub.
name: Imagem da API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Montar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.conda
          load: true
          tags: api:teste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste rápido (a API importa com o TensorFlow da imagem)
        run: docker run --rm --entrypoint "" api:teste /opt/conda/bin/python -c "import main; print('ok')"

      - name: Entrar no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.conda
          push: true
          # main = versão no ar; o hash do commit permite voltar a uma versão exata
          tags: |
            ghcr.io/site-alzheimer/back-end:main
            ghcr.io/site-alzheimer/back-end:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
